<text x="61" y="185.5" font-size="11" text-anchor="end" fill="#6b6b6b">0.4</text>
<line x1="70" y1="117.0" x2="700" y2="117.0" stroke="#e4e4e4" stroke-width="1"/>
<text x="61" y="120.5" font-size="11" text-anchor="end" fill="#6b6b6b">0.6</text>
