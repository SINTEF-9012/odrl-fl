<text x="61" y="55.5" font-size="11" text-anchor="end" fill="#6b6b6b">0.8</text>
<rect class="bar" x="111.0" y="103.1" width="58.0" height="208.9" fill="#0072B2" rx="2"/>
<text x="140.0" y="97.1" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">0.643</text>
<rect class="bar" x="321.0" y="106.7" width="58.0" height="205.3" fill="#0072B2" rx="2"/>
<text x="350.0" y="100.7" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">0.632</text>
<rect class="bar" x="531.0" y="106.6" width="58.0" height="205.4" fill="#0072B2" rx="2"/>
<text x="560.0" y="100.6" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">0.632</text>
<rect class="bar" x="595.0" y="270.7" width="58.0" height="41.3" fill="#D55E00" rx="2"/>
<text x="624.0" y="264.7" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">0.127</text>
<text x="175.0" y="332" font-size="11.5" text-anchor="middle" fill="#1a1a1a">whole federation</text>
<text x="385.0" y="332" font-size="11.5" text-anchor="middle" fill="#1a1a1a">policy-aware</text>
<text x="385.0" y="347" font-size="10.5" text-anchor="middle" fill="#6b6b6b">usable 100% of the time</text>
<text x="595.0" y="332" font-size="11.5" text-anchor="middle" fill="#1a1a1a">policy-blind</text>
<text x="595.0" y="347" font-size="10.5" text-anchor="middle" fill="#6b6b6b">usable 20% of the time</text>
<line x1="70" y1="149.5" x2="700" y2="149.5" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="696" y="143.5" font-size="10.5" text-anchor="end" fill="#1a1a1a">chance (C-index 0.5)</text>
<line x1="70" y1="312" x2="700" y2="312" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="16" y="182.0" font-size="11.5" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 16 182.0)">C-index</text>
<rect x="70" y="366" width="12" height="12" fill="#0072B2" rx="2"/>
<text x="88" y="376" font-size="11" fill="#1a1a1a">C-index as measured</text>
<rect x="227.39999999999998" y="366" width="12" height="12" fill="#D55E00" rx="2"/>
<text x="245.39999999999998" y="376" font-size="11" fill="#1a1a1a">deployable</text>
<text x="70" y="420" font-size="10.5" fill="#6b6b6b">The C-index bars differ by ~0.01 against a bootstrap interval of +/-0.11, so they are not separable. The deployable bar is, because feasibility does not depend on a metric.</text>
</svg>